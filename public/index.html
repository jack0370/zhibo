<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>直播间</title>
  <link rel="stylesheet" href="/css/room.css">
</head>
<body>
  <div class="phone" id="phone">
    <!-- 舞台：视频铺满，UI 叠在上面 -->
    <section class="stage" id="stage">
      <div class="video-wrap" id="videoWrap">
        <div class="video-placeholder" id="videoPlaceholder">加载中…</div>
        <!-- 透明拦截层：尺寸跟随视频本体，点击不传到播放器，无法暂停（像真直播） -->
        <div class="video-guard" id="videoGuard" hidden></div>
        <!-- 开启声音：拦截层盖住原生开声键，由本按钮(z-index 更高)接管 → 点击调 api.unmute() -->
        <button class="sound-btn" id="soundBtn" hidden>🔊 点击开启声音</button>
      </div>

      <!-- 顶栏（叠加） -->
      <header class="topbar">
        <div class="room-info">
          <div class="room-name" id="roomName">直播间</div>
          <div class="course-title" id="courseTitle"></div>
        </div>
        <div class="status-line">
          <span class="status-badge" id="statusBadge">连接中</span>
          <span class="viewers"><span class="eye">👁</span> <span id="viewerCount">0</span></span>
        </div>
      </header>

      <!-- 课程标题大字 banner（叠加在视频中上方） -->
      <div class="title-banner" id="titleBanner" hidden>
        <div class="tb-title" id="tbTitle"></div>
        <div class="tb-sub" id="tbSub"></div>
      </div>

      <!-- 互动评论流（叠加在视频下半部） -->
      <div class="feed-overlay">
        <span class="feed-hint" id="feedHint"></span>
        <div class="feed" id="feed"></div>
      </div>

      <!-- 预约开播倒计时（封面背景，到点自动开播） -->
      <div class="countdown-mask" id="countdownMask" hidden>
        <div class="countdown-card">
          <div class="countdown-pill">即将开始</div>
          <div class="countdown-title" id="countdownTitle"></div>
          <div class="countdown-sub" id="countdownSub"></div>
          <div class="countdown-timer" id="countdownTimer">--:--:--</div>
          <div class="countdown-hint">到点自动开始，先不要离开哦</div>
        </div>
      </div>

      <!-- 起播预缓冲：盖住开头那几秒的卡顿窗口 -->
      <div class="sync-mask" id="syncMask" hidden>
        <div class="sync-box">
          <div class="sync-spinner"></div>
          <div class="sync-text">正在同步直播进度…</div>
        </div>
      </div>

      <!-- 定时促销小卡（到点自动弹出，点击打开商品面板） -->
      <div class="promo-pop" id="promoPop" hidden>
        <button class="promo-close" id="promoClose" aria-label="关闭">×</button>
        <img class="promo-thumb" id="promoThumb" alt="">
        <div class="promo-body">
          <div class="promo-title" id="promoTitle"></div>
          <div class="promo-price"><span class="promo-now" id="promoPrice"></span></div>
        </div>
        <button class="promo-cta" id="promoCta">马上抢</button>
      </div>

      <!-- 进入直播间遮罩 -->
      <div class="enter-mask" id="enterMask" hidden>
        <div class="enter-card">
          <div class="enter-live-dot"></div>
          <div class="enter-title" id="enterTitle">直播进行中</div>
          <div class="enter-sub" id="enterSub">点击进入，和大家一起看</div>
          <button class="enter-btn" id="enterBtn">进入直播间</button>
        </div>
      </div>
    </section>

    <!-- 底部评论输入 -->
    <footer class="composer">
      <input id="commentInput" class="comment-input" type="text"
             placeholder="说点什么…" maxlength="200" autocomplete="off">
      <button id="flowerBtn" class="icon-btn" aria-label="送小花">🌸</button>
      <button id="likeBtn" class="icon-btn" aria-label="点赞">❤️</button>
      <button id="cartBtn" class="icon-btn" aria-label="课程" hidden>🛒</button>
      <button id="sendBtn" class="send-btn">发送</button>
    </footer>

    <!-- 点赞/送花 飘动图层 -->
    <div class="float-layer" id="floatLayer"></div>
  </div>

  <!-- 商品弹窗（半屏 bottom sheet：推荐商品 / 优惠券 / 订单 / 结账） -->
  <div class="shop-sheet-mask" id="shopMask" hidden>
    <div class="shop-sheet" id="shopSheet">
      <div class="shop-head">
        <div class="shop-name" id="shopName">店铺</div>
        <button class="shop-close" id="shopClose" aria-label="关闭">×</button>
      </div>
      <div class="shop-tabs" id="shopTabs">
        <button class="shop-tab active" data-stab="products">推荐商品</button>
        <button class="shop-tab" data-stab="coupons" hidden>优惠券</button>
        <button class="shop-tab" data-stab="orders" hidden>订单</button>
      </div>
      <div class="shop-body">
        <!-- 推荐商品 -->
        <div class="shop-panel" data-spanel="products">
          <div id="productList" class="product-list"></div>
        </div>
        <!-- 优惠券 -->
        <div class="shop-panel" data-spanel="coupons" hidden>
          <div id="couponList" class="coupon-list"></div>
        </div>
        <!-- 订单 -->
        <div class="shop-panel" data-spanel="orders" hidden>
          <div id="orderList" class="order-list"></div>
        </div>
        <!-- 结账（内嵌 Stripe Embedded Checkout） -->
        <div class="shop-panel" data-spanel="checkout" hidden>
          <button class="checkout-back" id="checkoutBack">← 返回</button>
          <div class="checkout-summary" id="checkoutSummary"></div>
          <div class="checkout-coupons" id="checkoutCoupons"></div>
          <div id="stripeBox" class="stripe-box"></div>
          <div class="checkout-loading" id="checkoutLoading" hidden>正在加载收银台…</div>
        </div>
        <!-- 支付成功 -->
        <div class="shop-panel" data-spanel="done" hidden>
          <div class="pay-done">
            <div class="pay-done-ico">✅</div>
            <div class="pay-done-title">支付成功</div>
            <div class="pay-done-sub" id="payDoneSub"></div>
            <button class="btn-primary pay-done-btn" id="payDoneBtn">继续观看直播</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 观看码准入门（开启时拦在最前面） -->
  <div class="gate-mask" id="gateMask" hidden>
    <div class="gate-card">
      <div class="gate-logo">🔒</div>
      <div class="gate-title">输入观看码进入直播间</div>
      <div class="gate-sub">本场直播为专属观看，请输入收到的观看码</div>
      <input id="gateInput" class="gate-input" type="text" placeholder="请输入观看码" autocomplete="off" maxlength="40">
      <button id="gateBtn" class="gate-btn">进入直播间</button>
      <div class="gate-err" id="gateErr"></div>
    </div>
  </div>

  <!-- 首次评论填昵称弹层 -->
  <div class="modal-mask" id="nameModal" hidden>
    <div class="modal">
      <div class="modal-title">取个昵称再发言吧</div>
      <input id="nickInput" class="modal-input" type="text" placeholder="昵称（必填）" maxlength="20">
      <input id="regionInput" class="modal-input" type="text" placeholder="地区（可选，如：吉隆坡）" maxlength="20">
      <div class="modal-actions">
        <button id="nickCancel" class="btn-ghost">取消</button>
        <button id="nickOk" class="btn-primary">开始互动</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="/js/room.js"></script>
</body>
</html>
